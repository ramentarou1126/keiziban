<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麺Earth 掲示板 — レビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EFE6D3;
    --parchment-deep:#E4D8BE;
    --ink:#1E2A3C;
    --ink-soft:#4B5A70;
    --seal:#A6362B;
    --seal-dark:#7E2620;
    --gold:#B8891F;
    --forest:#4A6741;
    --line:rgba(30,42,60,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(184,137,31,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74,103,65,0.06), transparent 45%),
      var(--parchment);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 20px 80px;}

  /* HERO */
  header.hero{
    padding:56px 20px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  h1.title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(34px,6vw,54px);
    margin:10px 0 6px;
    letter-spacing:.02em;
  }
  h1.title .men{ color:var(--seal); }
  .tagline{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:440px;
    margin:0 auto;
  }

  /* STAT LEDGER */
  .ledger{
    display:flex;
    justify-content:center;
    gap:0;
    margin:28px auto 0;
    max-width:520px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.35);
  }
  .ledger .cell{
    flex:1;
    padding:14px 10px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .ledger .cell:last-child{border-right:none;}
  .ledger .num{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    font-weight:600;
    color:var(--ink);
  }
  .ledger .label{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-top:2px;
  }

  /* CTA */
  .cta-row{
    display:flex;
    justify-content:center;
    margin:28px 0 8px;
  }
  button.btn-primary{
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    background:var(--seal);
    color:#fff;
    border:none;
    padding:13px 28px;
    cursor:pointer;
    letter-spacing:.03em;
    transition:background .15s ease, transform .1s ease;
  }
  button.btn-primary:hover{ background:var(--seal-dark); }
  button.btn-primary:active{ transform:scale(.98); }
  button.btn-primary:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  /* SECTION LABEL */
  .section-label{
    display:flex;
    align-items:center;
    gap:12px;
    margin:44px 0 18px;
  }
  .section-label .line{ flex:1; height:1px; background:var(--line); }
  .section-label span{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  /* REVIEW CARD */
  .review{
    background:rgba(255,255,255,0.4);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:14px;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .seal-badge{
    flex-shrink:0;
    width:52px; height:52px;
    border-radius:50%;
    border:2px solid var(--seal);
    color:var(--seal);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-family:'JetBrains Mono', monospace;
    transform:rotate(-6deg);
  }
  .seal-badge .n{ font-size:16px; font-weight:700; line-height:1; }
  .seal-badge .s{ font-size:9px; opacity:.8; }
  .review-body{ flex:1; min-width:0; }
  .review-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .review-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:17px;
  }
  .review-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .review-text{
    margin-top:8px;
    font-size:14.5px;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
    border:1px dashed var(--line);
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,26,36,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--parchment);
    border:1px solid var(--ink);
    max-width:460px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:26px 24px 22px;
  }
  .modal h2{
    font-family:'Shippori Mincho', serif;
    font-size:20px;
    margin:0 0 18px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    margin-bottom:6px;
    color:var(--ink-soft);
  }
  .field input[type=text], .field textarea{
    width:100%;
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 11px;
    resize:vertical;
  }
  .field textarea{ min-height:110px; }
  .field .count{
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .stars{
    display:flex;
    gap:4px;
    font-size:26px;
    user-select:none;
  }
  .stars .star{ cursor:pointer; color:var(--line); position:relative; }
  .stars .star.half::after{
    content:'★';
    position:absolute; left:0; top:0;
    width:50%; overflow:hidden;
    color:var(--gold);
  }
  .stars .star.full{ color:var(--gold); }
  .rating-readout{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    margin-top:6px;
    color:var(--ink-soft);
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }
  button.btn-ghost{
    background:none;
    border:1px solid var(--line);
    padding:10px 16px;
    font-family:'Noto Sans JP', sans-serif;
    font-size:13.5px;
    cursor:pointer;
  }
  .status-msg{
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }
  .status-msg.error{ color:var(--seal); }
  .status-msg.ok{ color:var(--forest); }

  footer{
    text-align:center;
    padding:30px 20px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">1:2000 SCALE EARTH — MINECRAFT BEDROCK</div>
  <h1 class="title"><span class="men">麺</span>Earth 掲示板</h1>
  <p class="tagline">プレイヤーからのレビューを集める場所。良いところも、改善してほしいところも。</p>

  <div class="ledger">
    <div class="cell">
      <div class="num" id="stat-avg">–</div>
      <div class="label">平均評価</div>
    </div>
    <div class="cell">
      <div class="num" id="stat-count">0</div>
      <div class="label">レビュー数</div>
    </div>
  </div>

  <div class="cta-row">
    <button class="btn-primary" id="open-modal-btn">レビューを書く</button>
  </div>
</header>

<div class="wrap">
  <div class="section-label"><span>すべてのレビュー</span><div class="line"></div></div>
  <div id="review-list">
    <div class="empty-state">まだレビューがありません。最初の1件を書いてみませんか？</div>
  </div>
</div>

<footer>MEN EARTH SERVER — REVIEW LEDGER — v0.1 (プロトタイプ)</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>レビューを書く</h2>

    <div class="field">
      <label for="f-title">タイトル</label>
      <input type="text" id="f-title" maxlength="60" placeholder="例：初心者でも遊びやすい！">
    </div>

    <div class="field">
      <label for="f-name">名前（未入力の場合は「匿名」になります）</label>
      <input type="text" id="f-name" maxlength="24" placeholder="例：ゆゆ">
    </div>

    <div class="field">
      <label>評価</label>
      <div class="stars" id="stars"></div>
      <div class="rating-readout" id="rating-readout">評価: 未選択</div>
    </div>

    <div class="field">
      <label for="f-body">レビュー内容（1000文字以内）</label>
      <textarea id="f-body" maxlength="1000"></textarea>
      <div class="count"><span id="body-count">0</span> / 1000</div>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <div class="modal-actions">
      <button class="btn-ghost" id="cancel-btn">キャンセル</button>
      <button class="btn-primary" id="submit-btn">送信する</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ▼▼▼ ここに自分のFirebaseプロジェクトの設定を入れてください ▼▼▼
  // Firebaseコンソール → プロジェクトの設定 → マイアプリ → SDK の設定と構成 に表示されています。
  // 既存の men-earth-map.html で使っているものと同じプロジェクトを使い回してOKです。
  const firebaseConfig = {
    apiKey: "AIzaSyCqaT20w22hlXr1hjBr2yINW6nXVx-3jI0",
    authDomain: "menearth-sigen-37c37.firebaseapp.com",
    databaseURL: "https://menearth-sigen-37c37-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "menearth-sigen-37c37",
    storageBucket: "menearth-sigen-37c37.firebasestorage.app",
    messagingSenderId: "6218144437",
    appId: "1:6218144437:web:2273b30af1814ce85ffcfc"
  };
  // ▲▲▲ ここまで ▲▲▲

  let db = null;
  let firebaseReady = false;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    firebaseReady = true;
  } catch (e) {
    console.warn("Firebase未設定のため、レビュー機能はプレビューのみ動作します。", e);
  }

  const reviewsRef = firebaseReady ? ref(db, "reviews") : null;

  // ---------- UI要素 ----------
  const openBtn = document.getElementById('open-modal-btn');
  const overlay = document.getElementById('modal-overlay');
  const cancelBtn = document.getElementById('cancel-btn');
  const submitBtn = document.getElementById('submit-btn');
  const bodyEl = document.getElementById('f-body');
  const bodyCount = document.getElementById('body-count');
  const titleEl = document.getElementById('f-title');
  const nameEl = document.getElementById('f-name');
  const statusMsg = document.getElementById('status-msg');
  const starsWrap = document.getElementById('stars');
  const ratingReadout = document.getElementById('rating-readout');
  const listEl = document.getElementById('review-list');
  const statAvg = document.getElementById('stat-avg');
  const statCount = document.getElementById('stat-count');

  let currentRating = 0;

  // 星（0.5刻み、5個の★を左右分割してクリック判定）
  for (let i = 1; i <= 5; i++) {
    const starOuter = document.createElement('span');
    starOuter.style.position = 'relative';
    starOuter.style.display = 'inline-block';
    starOuter.style.width = '26px';

    const bg = document.createElement('span');
    bg.textContent = '★';
    bg.style.color = 'var(--line)';
    starOuter.appendChild(bg);

    const fillWrap = document.createElement('span');
    fillWrap.textContent = '★';
    fillWrap.style.position = 'absolute';
    fillWrap.style.left = '0';
    fillWrap.style.top = '0';
    fillWrap.style.overflow = 'hidden';
    fillWrap.style.width = '0%';
    fillWrap.style.color = 'var(--gold)';
    fillWrap.dataset.fill = i;
    starOuter.appendChild(fillWrap);

    // クリック領域を左半分・右半分に分ける
    const leftHit = document.createElement('span');
    leftHit.style.position = 'absolute';
    leftHit.style.left = '0'; leftHit.style.top = '0';
    leftHit.style.width = '50%'; leftHit.style.height = '100%';
    leftHit.style.cursor = 'pointer';
    leftHit.onclick = () => setRating(i - 0.5);

    const rightHit = document.createElement('span');
    rightHit.style.position = 'absolute';
    rightHit.style.right = '0'; rightHit.style.top = '0';
    rightHit.style.width = '50%'; rightHit.style.height = '100%';
    rightHit.style.cursor = 'pointer';
    rightHit.onclick = () => setRating(i);

    starOuter.appendChild(leftHit);
    starOuter.appendChild(rightHit);
    starsWrap.appendChild(starOuter);
  }

  function setRating(val) {
    currentRating = val;
    ratingReadout.textContent = `評価: ${val.toFixed(1)} / 5.0`;
    document.querySelectorAll('#stars [data-fill]').forEach(fillEl => {
      const starIndex = parseInt(fillEl.dataset.fill, 10);
      let pct = 0;
      if (val >= starIndex) pct = 100;
      else if (val >= starIndex - 0.5) pct = 50;
      fillEl.style.width = pct + '%';
    });
  }

  bodyEl.addEventListener('input', () => {
    bodyCount.textContent = bodyEl.value.length;
  });

  openBtn.onclick = () => {
    overlay.classList.add('open');
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
  };
  cancelBtn.onclick = () => overlay.classList.remove('open');
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };

  submitBtn.onclick = async () => {
    const title = titleEl.value.trim();
    const name = nameEl.value.trim() || '匿名';
    const body = bodyEl.value.trim();

    if (!title) { showStatus('タイトルを入力してください。', true); return; }
    if (!body) { showStatus('レビュー内容を入力してください。', true); return; }
    if (body.length > 1000) { showStatus('レビューは1000文字以内にしてください。', true); return; }
    if (currentRating === 0) { showStatus('評価を選択してください（0.5〜5）。', true); return; }

    if (!firebaseReady) {
      showStatus('Firebaseが未設定のため、まだ保存できません（プレビューモード）。', true);
      return;
    }

    submitBtn.disabled = true;
    try {
      await push(reviewsRef, {
        title, name, body,
        rating: currentRating,
        createdAt: serverTimestamp()
      });
      showStatus('送信しました！', false);
      titleEl.value = ''; nameEl.value = ''; bodyEl.value = '';
      bodyCount.textContent = '0';
      setRating(0);
      setTimeout(() => overlay.classList.remove('open'), 700);
    } catch (e) {
      console.error(e);
      showStatus('送信に失敗しました。通信環境をご確認ください。', true);
    } finally {
      submitBtn.disabled = false;
    }
  };

  function showStatus(msg, isError) {
    statusMsg.textContent = msg;
    statusMsg.className = 'status-msg ' + (isError ? 'error' : 'ok');
  }

  // ---------- 一覧描画 ----------
  function renderReviews(items) {
    if (!items.length) {
      listEl.innerHTML = '<div class="empty-state">まだレビューがありません。最初の1件を書いてみませんか？</div>';
      statAvg.textContent = '–';
      statCount.textContent = '0';
      return;
    }
    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    const avg = items.reduce((s, r) => s + r.rating, 0) / items.length;
    statAvg.textContent = avg.toFixed(1);
    statCount.textContent = items.length;

    listEl.innerHTML = items.map(r => {
      const date = r.createdAt ? new Date(r.createdAt) : null;
      const dateStr = date ? `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}` : '';
      return `
        <div class="review">
          <div class="seal-badge"><div class="n">${r.rating.toFixed(1)}</div><div class="s">STARS</div></div>
          <div class="review-body">
            <div class="review-top">
              <div class="review-title">${escapeHtml(r.title)}</div>
              <div class="review-meta">${escapeHtml(r.name)} ・ ${dateStr}</div>
            </div>
            <div class="review-text">${escapeHtml(r.body)}</div>
          </div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  if (firebaseReady) {
    onValue(reviewsRef, (snapshot) => {
      const val = snapshot.val() || {};
      const items = Object.values(val).map(v => ({
        ...v,
        createdAt: v.createdAt || 0
      }));
      renderReviews(items);
    });
  } else {
    renderReviews([]);
  }
</script>

</body>
</html>
